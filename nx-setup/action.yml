# The one definition of "get an nx workspace ready to run targets", composed by
# every workflow here so a toolchain change lands once instead of per product.
#
# mise reads the calling repository's `.tool-versions`, and exports PATH through
# GITHUB_PATH, which the runner prepends - that is what stops a shim left by
# another version manager from answering first.
#
# Third-party actions are pinned by commit SHA (see the ref policy in README.md).
name: nx-setup
description: Check out an nx workspace, install its toolchain and dependencies, and restore the nx cache.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `nx affected`
      needs to resolve a base commit; a workflow that never runs `affected` may
      pass 1 to check out faster.
    required: false
    default: '0'

  npm-token:
    description: >
      Read credential for a private package scope. Needed wherever the lockfile
      names a package the public registry does not serve. Left empty, the
      authentication step is skipped, so a workspace with no private dependency
      needs no secret and no caller has to pass one.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install the toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.9

    # Written to a runner-local file, not the workspace's `.npmrc`, which is
    # tracked: `npm config set` would drop a credential into a file git is
    # watching, mid-job. npm and pnpm merge this layer UNDER the repository's, so
    # the scope-to-registry mapping committed there still decides the host.
    - name: Authenticate to the private registry
      if: inputs.npm-token != ''
      shell: bash
      env:
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        printf '//npm.zeroxsolutions.com/repository/zeroxsolutions/:_authToken=%s\n' \
          "$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
        echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Only `.nx/cache` needs it: that is inside the workspace, which checkout
    # wipes. The pnpm store is outside it and every workflow here is self-hosted.
    - name: Restore the nx cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
          nx-${{ runner.os }}-
