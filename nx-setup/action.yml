# The one definition of "get an nx workspace ready to run targets", composed by
# every workflow here so a toolchain change lands once instead of per product.
#
# mise reads the calling repository's `.tool-versions`, and exports PATH through
# GITHUB_PATH, which the runner prepends - that is what stops a shim left by
# another version manager from answering first.
#
# Third-party actions are pinned by commit SHA (see the ref policy in README.md).
name: nx-setup
description: Check out an nx workspace, install its toolchain and dependencies, and point its cache at the runner's own disk.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `nx affected`
      needs to resolve a base commit; a workflow that never runs `affected` may
      pass 1 to check out faster.
    required: false
    default: '0'
  max-cache-size:
    description: >
      Cap on the runner's task cache for this repository, in nx's size syntax
      (e.g. "10GB"). It has to hold several full runs of the repository's
      outputs; the machine's disk is shared with every other repository's cap.
    required: false
    default: '10GB'

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    # `.nx/cache` defaults to inside the workspace, which checkout wipes. This puts it
    # where the pnpm store already survives, so the runner's own disk is the cache and
    # nothing is uploaded or downloaded to hold it.
    #
    # `actions/cache` held it before, under a key ending in the commit SHA. A new commit
    # matches no existing key, so every job wrote a fresh entry and no job ever read one
    # back exactly: travel reached 25 entries and 10.8 GB against GitHub's 10 GB per
    # repository, each carrying about half a gigabyte each way over the network.
    #
    # nx's own default cap is a share of the free disk, which is no cap on a machine
    # every product's gate lands on. The cap belongs here rather than in a caller's
    # `nx.json` for the same reason: a product cannot see what else holds that disk.
    # The cap has to hold several full runs of a product's outputs, or each gate evicts the
    # dependency builds the next pull request would have restored, and the hit rate falls to near
    # zero even with both directories moved.
    #
    # Both directories have to move. nx keeps the task outputs in one and the metadata
    # naming them in the other, and it refuses an artifact it holds no metadata for:
    # "Nx found unrecognized artifacts in the cache directory and will not be able to
    # use them." Moving only the outputs leaves the metadata in `.nx/workspace-data`,
    # which checkout wipes, so every job faces a full cache it is not allowed to read.
    # That is what held every gate at `Cache: 0/118 hit (0%)`.
    #
    # Two jobs of one repository sharing a runner share this metadata. nx takes that
    # lock the same way two terminals on a developer's machine do.
    - name: Point the nx cache at the runner's own disk
      shell: bash
      run: |
        cache_dir="${HOME}/.cache/nx-ci/${GITHUB_REPOSITORY}"
        mkdir -p "${cache_dir}/artifacts" "${cache_dir}/metadata"
        {
          echo "NX_CACHE_DIRECTORY=${cache_dir}/artifacts"
          echo "NX_WORKSPACE_DATA_DIRECTORY=${cache_dir}/metadata"
          echo "NX_MAX_CACHE_SIZE=${{ inputs.max-cache-size }}"
        } >> "${GITHUB_ENV}"

    - name: Install the toolchain
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.8.9

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
