# The one definition of "get an nx workspace ready to run targets".
#
# Every workflow in this repository composes this action, and every product
# reaches it through those workflows - so a toolchain change lands here once
# instead of in each product's .github/.
#
# It reads its versions from the CALLING repository's own declarations rather than
# pinning them here: both Node and pnpm come from `.tool-versions`, so a product
# bumps its toolchain in one file and no workflow has to be remembered.
#
# pnpm needs the explicit read below because `pnpm/action-setup` accepts only its
# own `version` input or `packageManager` in package.json - it never reads
# `.tool-versions`. Deriving it here is what lets a product drop `packageManager`,
# whose self-switching gives different machines different pnpm versions.
#
# Third-party actions are pinned by commit SHA. That is where the real
# supply-chain risk sits, and pinning here pins it once for every product rather
# than once per product (see the ref policy in README.md).
name: nx-setup
description: Check out an nx workspace, install its toolchain and dependencies, and restore the nx cache.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `nx affected`
      needs to resolve a base commit; a workflow that never runs `affected` may
      pass 1 to check out faster.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Resolve the pnpm version from .tool-versions
      id: pnpm
      shell: bash
      run: |
        if [ ! -f .tool-versions ]; then
          echo '::error::.tool-versions is missing; nx-setup reads the pnpm version from it'
          exit 1
        fi
        version="$(awk '$1 == "pnpm" { print $2; exit }' .tool-versions)"
        if [ -z "$version" ]; then
          echo '::error::.tool-versions declares no pnpm entry'
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "pnpm $version"

    # Before setup-node: it reads the pnpm store path to build its cache key, so
    # pnpm has to be on PATH first.
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # nx's own cache, distinct from the pnpm store cache above. Keyed on the
    # lockfile so a dependency change starts cold; restore-keys let an unchanged
    # lockfile reuse the previous run's computation.
    - name: Restore the nx cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
          nx-${{ runner.os }}-
