# The one definition of "get an nx workspace ready to run targets", composed by
# every workflow here so a toolchain change lands once instead of per product.
#
# mise reads the calling repository's `.tool-versions`, and exports PATH through
# GITHUB_PATH, which the runner prepends - that is what stops a shim left by
# another version manager from answering first.
#
# Third-party actions are pinned by commit SHA (see the ref policy in README.md).
name: nx-setup
description: Check out an nx workspace, install its toolchain and dependencies, and restore the nx cache.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `nx affected`
      needs to resolve a base commit; a workflow that never runs `affected` may
      pass 1 to check out faster.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install the toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.9

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Only `.nx/cache` needs it: that is inside the workspace, which checkout
    # wipes. The pnpm store is outside it and every workflow here is self-hosted.
    - name: Restore the nx cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
          nx-${{ runner.os }}-
