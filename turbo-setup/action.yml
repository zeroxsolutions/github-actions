# The one definition of "get a Turborepo workspace ready to run tasks", composed
# by every turbo workflow here so a toolchain change lands once instead of per
# product.
#
# mise reads the calling repository's `.tool-versions`, and exports PATH through
# GITHUB_PATH, which the runner prepends - that is what stops a shim left by
# another version manager from answering first.
#
# Third-party actions are pinned by commit SHA (see the ref policy in README.md).
name: turbo-setup
description: Check out a Turborepo workspace, install its toolchain and dependencies, and point its cache at the runner's own disk.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `turbo run
      --affected` needs to resolve a base commit; a workflow that never runs
      `--affected` may pass 1 to check out faster.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    # `.turbo` defaults to inside the workspace, which checkout wipes. This puts it
    # where the pnpm store already survives, so the runner's own disk is the cache and
    # nothing is uploaded or downloaded to hold it.
    #
    # `actions/cache` held it before, under a key ending in the commit SHA. A new commit
    # matches no existing key, so every job wrote a fresh entry and no job ever read one
    # back exactly, until the entries crowded a repository out of GitHub's 10 GB.
    #
    # turbo has no counterpart to `NX_MAX_CACHE_SIZE`, so nothing trims this directory.
    # README.md carries the command that does.
    - name: Point the turbo cache at the runner's own disk
      shell: bash
      run: |
        cache_dir="${HOME}/.cache/turbo-ci/${GITHUB_REPOSITORY}"
        mkdir -p "${cache_dir}"
        echo "TURBO_CACHE_DIR=${cache_dir}" >> "${GITHUB_ENV}"

    - name: Install the toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.8.9

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
