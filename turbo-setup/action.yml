# The one definition of "get a Turborepo workspace ready to run tasks", composed
# by every turbo workflow here so a toolchain change lands once instead of per
# product.
#
# mise reads the calling repository's `.tool-versions`, and exports PATH through
# GITHUB_PATH, which the runner prepends - that is what stops a shim left by
# another version manager from answering first.
#
# Third-party actions are pinned by commit SHA (see the ref policy in README.md).
name: turbo-setup
description: Check out a Turborepo workspace, install its toolchain and dependencies, and restore the turbo cache.

inputs:
  fetch-depth:
    description: >
      Git history depth. The default of 0 (full history) is what `turbo run
      --affected` needs to resolve a base commit; a workflow that never runs
      `--affected` may pass 1 to check out faster.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Check out the calling repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install the toolchain
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        version: 2026.8.9

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Only `.turbo` needs it: that is inside the workspace, which checkout
    # wipes. The pnpm store is outside it and every workflow here is self-hosted.
    - name: Restore the turbo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
