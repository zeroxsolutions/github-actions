# Run nx targets against the calling repository. No deployment environment is
# declared here, so a job running this workflow resolves no environment secret -
# a gate is structurally incapable of deploying, rather than merely forbidden
# from it. Deploys use nx-deploy.yml instead.
#
# For a workflow that needs bespoke steps of its own (a container, a git
# assertion), compose the `nx-setup` action directly in your own job instead of
# calling this; a job that delegates to a reusable workflow cannot add steps.
name: nx-gate

on:
  workflow_call:
    inputs:
      targets:
        description: 'Space-separated nx targets, e.g. "lint build test".'
        required: true
        type: string
      mode:
        description: >
          "affected" runs only what the change reaches - the right question for a
          gate. "run-many" sweeps every project defining the target. Falls back to
          run-many automatically when no usable base commit exists.
        required: false
        type: string
        default: affected

      timeout-minutes:
        description: 'Minutes before the job is killed; the targets are killed two minutes earlier, so an overrun reports as a failure. The default clears the slowest gate measured across these repos (18 min, classify, 2026-08-21).'
        required: false
        type: number
        default: 30

jobs:
  run:
    runs-on: self-hosted
    # GitHub's default is 360 minutes, and these runners are self-hosted and take
    # one job at a time - so a hung job holds a runner out of the pool for six
    # hours. Measured 2026-08-21: a stuck e2e held one for 57 minutes and only
    # stopped because it was cancelled by hand.
    #
    # The backstop for what the step's own budget cannot cover, its own setup: the step
    # kills the targets two minutes earlier and names the overrun. That subtraction is
    # bash's, in the step - a `${{ }}` expression has no arithmetic, and `+ 2` written here
    # made the whole file unparseable (runs 34441799042 through 34457761385, 2026-09-10).
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # Pinned literal, not an input: `uses:` admits no expression at step
      # level. The action and this workflow ship from one repository under one
      # tag, so referencing the same moving tag keeps them in lockstep by
      # construction - moving v1 moves both together.
      - uses: zeroxsolutions/github-actions/nx-setup@v1

      # Nothing that launches a browser installs it: neither `playwright test` nor the
      # vitest browser provider does. A caller's `test` target can be what launches one,
      # not only its `e2e` target.
      #
      # The system libraries come from the caller's own Playwright, so its upgrade brings its
      # own list. `install-deps` installs them through sudo, which fails without a passwordless
      # sudo for the runner user, and does nothing at all on a machine Playwright holds no
      # package list for. `--dry-run` exits 0 once every package in that list is present, so a
      # provisioned machine never reaches sudo.
      #
      # The list can lack a package for a library a browser loads, and only `playwright install`
      # checks the libraries themselves. Its warning becomes an annotation rather than a
      # failure, because a caller that never starts the browser concerned passes.
      - name: Install Playwright browsers
        shell: bash
        run: |
          [ -e node_modules/@playwright/test ] || {
            echo 'no playwright in this workspace; nothing to install'
            exit 0
          }
          pnpm exec playwright install-deps --dry-run || pnpm exec playwright install-deps
          install_log="${RUNNER_TEMP:-/tmp}/playwright-install.log"
          pnpm exec playwright install 2>&1 | tee "${install_log}"
          if grep -q 'Host system is missing dependencies' "${install_log}"; then
            echo '::warning title=Browser libraries missing::A library a Playwright browser loads is not on this machine, and Playwright names no package for it. The list is in this step'"'"'s log; a test starting that browser fails.'
          fi

      # A push that creates a branch reports an all-zero "before" commit, and a
      # shallow-cloned default branch may not be present to diff against. Rather
      # than fail or silently select nothing, degrade to a full sweep - a
      # superset is always a safe answer for a gate.
      - name: Resolve the affected range
        id: range
        shell: bash
        run: |
          mode='${{ inputs.mode }}'
          base=''
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          case "$base" in
            ''|0000000000000000000000000000000000000000) base='' ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base $base is not reachable in this checkout; sweeping instead"
            base=''
          fi
          if [ "$mode" = 'affected' ] && [ -z "$base" ]; then
            echo 'no usable base commit; falling back to run-many'
            mode='run-many'
          fi
          echo "mode=$mode"   >> "$GITHUB_OUTPUT"
          echo "base=$base"   >> "$GITHUB_OUTPUT"

      # No runner in this pool ships `timeout`, `gtimeout` or coreutils. The kill takes the
      # process group, because a gate's command is a tree and signalling the pid alone leaves
      # the rest holding ports.
      - name: Run the targets under a budget, so an overrun fails rather than reads as cancelled
        shell: bash
        env:
          NX_BASE: ${{ steps.range.outputs.base }}
          NX_HEAD: ${{ github.sha }}
        run: |
          budget_seconds=$(( ${{ inputs.timeout-minutes }} * 60 - 120 ))
          [ "${budget_seconds}" -ge 60 ] || budget_seconds=60
          overrun_marker="${RUNNER_TEMP:-/tmp}/nx-gate-overrun.$$"
          rm -f "${overrun_marker}"

          set -m
          if [ '${{ steps.range.outputs.mode }}' = 'affected' ]; then
            pnpm nx affected -t ${{ inputs.targets }} &
          else
            pnpm nx run-many -t ${{ inputs.targets }} &
          fi
          command_pid=$!
          set +m

          set -m
          (
            sleep "${budget_seconds}"
            : > "${overrun_marker}"
            kill -TERM -"${command_pid}" 2>/dev/null || kill -TERM "${command_pid}" 2>/dev/null
          ) &
          watchdog_pid=$!
          set +m

          command_status=0
          wait "${command_pid}" || command_status=$?

          # The group, or the watchdog's own `sleep` runs out the budget after the subshell goes.
          kill -TERM -"${watchdog_pid}" 2>/dev/null || true
          wait "${watchdog_pid}" 2>/dev/null || true

          if [ -e "${overrun_marker}" ]; then
            rm -f "${overrun_marker}"
            echo "::error title=Gate budget exceeded::The targets did not finish within ${budget_seconds}s and were killed. This is a budget kill, not a cancellation."
            exit 1
          fi
          exit "${command_status}"
