# Run nx targets against the calling repository. No deployment environment is
# declared here, so a job running this workflow resolves no environment secret -
# a gate is structurally incapable of deploying, rather than merely forbidden
# from it. Deploys use nx-deploy.yml instead.
#
# For a workflow that needs bespoke steps of its own (a container, a git
# assertion), compose the `nx-setup` action directly in your own job instead of
# calling this; a job that delegates to a reusable workflow cannot add steps.
name: nx-gate

on:
  workflow_call:
    inputs:
      targets:
        description: 'Space-separated nx targets, e.g. "lint build test".'
        required: true
        type: string
      mode:
        description: >
          "affected" runs only what the change reaches - the right question for a
          gate. "run-many" sweeps every project defining the target. Falls back to
          run-many automatically when no usable base commit exists.
        required: false
        type: string
        default: affected

      timeout-minutes:
        description: 'Minutes before the targets are killed and the step fails. The default clears the slowest gate measured across these repos (18 min, classify, 2026-08-21).'
        required: false
        type: number
        default: 30

jobs:
  run:
    runs-on: self-hosted
    # GitHub's default is 360 minutes, and these runners are self-hosted and take
    # one job at a time - so a hung job holds a runner out of the pool for six
    # hours. Measured 2026-08-21: a stuck e2e held one for 57 minutes and only
    # stopped because it was cancelled by hand.
    #
    # Two minutes above the step's own budget, so the step always wins the race and
    # reports the overrun as a FAILURE. This job-level kill is the backstop for what
    # the step cannot cover - its own setup - and it still lands as `cancelled`.
    timeout-minutes: ${{ inputs.timeout-minutes + 2 }}
    steps:
      # Pinned literal, not an input: `uses:` admits no expression at step
      # level. The action and this workflow ship from one repository under one
      # tag, so referencing the same moving tag keeps them in lockstep by
      # construction - moving v1 moves both together.
      - uses: zeroxsolutions/github-actions/nx-setup@v1

      # @nx/playwright's inferred target runs `playwright test` alone; only its
      # executor, which these workspaces do not use, installs the browsers first.
      # Some repos pass `targets: e2e` without depending on playwright at all.
      - name: Install Playwright browsers
        if: ${{ contains(inputs.targets, 'e2e') }}
        shell: bash
        run: |
          [ -e node_modules/@playwright/test ] || {
            echo 'no playwright in this workspace; nothing to install'
            exit 0
          }
          pnpm exec playwright install

      # A push that creates a branch reports an all-zero "before" commit, and a
      # shallow-cloned default branch may not be present to diff against. Rather
      # than fail or silently select nothing, degrade to a full sweep - a
      # superset is always a safe answer for a gate.
      - name: Resolve the affected range
        id: range
        shell: bash
        run: |
          mode='${{ inputs.mode }}'
          base=''
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          case "$base" in
            ''|0000000000000000000000000000000000000000) base='' ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base $base is not reachable in this checkout; sweeping instead"
            base=''
          fi
          if [ "$mode" = 'affected' ] && [ -z "$base" ]; then
            echo 'no usable base commit; falling back to run-many'
            mode='run-many'
          fi
          echo "mode=$mode"   >> "$GITHUB_OUTPUT"
          echo "base=$base"   >> "$GITHUB_OUTPUT"

      # A budget the targets cannot outlive, so an overrun is this step's own FAILURE with a
      # reason in the log. A `timeout-minutes` kill lands as `cancelled`, which is the word a
      # human pressing cancel and a superseding `cancel-in-progress` also produce - so a gate
      # that never finished reads as a gate nobody wanted. Measured in zeroxsolutions/travel,
      # 2026-09-09: of three e2e jobs reported `cancelled`, one was the budget, one was
      # superseded, and one is still unexplained.
      #
      # bash's own watchdog, because `timeout` is not on a macOS runner - checked on
      # evolit-mac-mini 2026-09-10: no `timeout`, no `gtimeout`, no coreutils.
      #
      # Job control gives each background job a process group of its own, and the kill takes the
      # GROUP. A gate's command is a tree - pnpm, nx, its daemon, a dev server a test started -
      # and signalling the pid alone leaves the rest holding ports: an orphaned workerd held 8787
      # on this runner for two days and hung every e2e job that followed
      # (zeroxsolutions/travel#112).
      - name: Run the targets
        shell: bash
        env:
          NX_BASE: ${{ steps.range.outputs.base }}
          NX_HEAD: ${{ github.sha }}
        run: |
          budget_seconds=$(( ${{ inputs.timeout-minutes }} * 60 ))
          overrun_marker="${RUNNER_TEMP:-/tmp}/nx-gate-overrun.$$"
          rm -f "${overrun_marker}"

          set -m
          if [ '${{ steps.range.outputs.mode }}' = 'affected' ]; then
            pnpm nx affected -t ${{ inputs.targets }} &
          else
            pnpm nx run-many -t ${{ inputs.targets }} &
          fi
          command_pid=$!
          set +m

          set -m
          (
            sleep "${budget_seconds}"
            : > "${overrun_marker}"
            kill -TERM -"${command_pid}" 2>/dev/null || kill -TERM "${command_pid}" 2>/dev/null
          ) &
          watchdog_pid=$!
          set +m

          command_status=0
          wait "${command_pid}" || command_status=$?

          # The group: the watchdog's own `sleep` is a child, and killing the subshell alone
          # leaves it to run out the budget.
          kill -TERM -"${watchdog_pid}" 2>/dev/null || true
          wait "${watchdog_pid}" 2>/dev/null || true

          if [ -e "${overrun_marker}" ]; then
            rm -f "${overrun_marker}"
            echo "::error title=Gate budget exceeded::The targets did not finish within ${budget_seconds}s and were killed. This is a budget kill, not a cancellation."
            exit 1
          fi
          exit "${command_status}"
