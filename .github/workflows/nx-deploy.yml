# Deploy a product by running an nx target per environment.
#
# The environment is declared on this job, taking its name from an input, and it
# resolves against the CALLING repository - verified by experiment, because the
# documentation does not state it. So each product keeps its own environments,
# its own credentials, and its own protection rules; this repository holds the
# definition and can hold no product's secret even in principle.
#
# Deploys sweep with run-many rather than affected on purpose. Workers are
# coupled at runtime by service bindings and queues, which the build graph does
# not model, so shipping a subset admits version skew between two independently
# deployed services.
name: nx-deploy

on:
  workflow_call:
    inputs:
      targets:
        description: 'Space-separated nx deploy targets, e.g. "wrangler:deploy".'
        required: true
        type: string
      environment:
        description: >
          Name of the environment in the CALLING repository. It supplies the
          credentials and any protection rule, so a protected name pauses this
          job until a reviewer approves.
        required: true
        type: string
      configuration:
        description: 'nx configuration to select, passed as -c. Defaults to the environment name, which is the convention these products follow.'
        required: false
        type: string
        default: ''

      timeout-minutes:
        description: 'Minutes before the job is killed. Deploys measured here run under 5 minutes.'
        required: false
        type: number
        default: 30

jobs:
  deploy:
    runs-on: self-hosted
    # GitHub's default is 360 minutes, and these runners are self-hosted and take
    # one job at a time, so a hung job holds a runner out of the pool for six
    # hours. Killing a deploy leaves a partial sweep - so does the 6-hour
    # default, six hours later - and re-running the same commit repairs it.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    # `env` accepts a map, so the whole vars context forwards in one line. A
    # build-time value cannot arrive any other way: a framework that inlines
    # config at build (Next's NEXT_PUBLIC_*) reads the build process's
    # environment, which a runtime binding never reaches. Only `vars` - a secret
    # in every build's environment is not something to hand out by default.
    #
    # The VS Code Actions extension flags the next line ("MappingToken was
    # expected") and is wrong - the runtime takes an expression that evaluates to
    # a map. Any product's green `deploy / deploy` job is the proof. Spelling it
    # as a literal map to silence the linter drops every var the map omits, which
    # ships as a green deploy with a broken frontend.
    env: ${{ vars }}
    steps:
      # Pinned literal, not an input: `uses:` admits no expression at step
      # level. The action and this workflow ship from one repository under one
      # tag, so referencing the same moving tag keeps them in lockstep by
      # construction - moving v1 moves both together.
      - uses: zeroxsolutions/github-actions/nx-setup@v1
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          config='${{ inputs.configuration }}'
          [ -n "$config" ] || config='${{ inputs.environment }}'
          pnpm nx run-many -t ${{ inputs.targets }} -c "$config"
